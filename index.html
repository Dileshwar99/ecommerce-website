<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              neous: {
                black: '#0a0a0a',
                dark: '#121212',

                accent: '#ccff00',

      ::-webkit-scrollbar-track {
        background: #121212;
      }

        background: #333;

      }
      ::-webkit-scrollbar-thumb:hover {
